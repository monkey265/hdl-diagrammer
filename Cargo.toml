[package]
name = "hdl-diagrammer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
molt = "0.3.1"
regex = "1.13.2"
resvg = { version = "0.50.0", default-features = false, features = ["system-fonts", "text"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1
